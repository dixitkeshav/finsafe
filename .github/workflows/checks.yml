name: Data and scoring checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.lock
      - run: python -m pip install --no-deps -e .
      - run: finsafe doctor
      - run: python -m unittest discover -s tests -v
      - run: finsafe prepare --input data/examples/seed.jsonl --out data/processed
      - run: python scripts/curate.py
